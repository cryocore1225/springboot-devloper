plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.0' // Spring Boot 버전 3.4.0으로.
    id 'io.spring.dependency-management' version '1.1.0'
}

group 'me.scpark'
version '1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(22) // java는 oracle jdk 22
    }
}


repositories {
    mavenCentral()
}


dependencies {
    // Web 层：提供 Spring MVC 和内置的 Web 服务器。
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // 数据访问层：会一并带入 Spring Data JPA、Hibernate 和 HikariCP 连接池。
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // H2 数据库驱动，只在运行程序时需要，版本由 Spring Boot 统一管理。
    runtimeOnly 'com.h2database:h2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}


test {
    useJUnitPlatform()
}