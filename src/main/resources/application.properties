# 内置 Web 服务器监听的端口，浏览器访问 http://localhost:8080/ 即可。
server.port=8080

# ---------------------------------------------------------------
# 数据源：H2 内存数据库
# ---------------------------------------------------------------
# mem:springbootdb 表示数据库建在内存里，程序一关数据就没了。
# DB_CLOSE_DELAY=-1 是关键：H2 内存库默认会在最后一个连接关闭时被销毁，
# 而连接池会回收空闲连接，不加这个参数数据可能在运行中途凭空消失。
spring.datasource.url=jdbc:h2:mem:springbootdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 打开 H2 自带的网页版数据库控制台，地址是 http://localhost:8080/h2-console，
# 可以直接在里面执行 SQL 查看数据到底存成了什么样。
spring.h2.console.enabled=true

# ---------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------
# create-drop：启动时按实体类建表，关闭时删表。内存库每次重启本来就是空的，
# 用它比 update 更直白，而且不会出现表结构与实体类对不上的情况。
spring.jpa.hibernate.ddl-auto=create-drop
# 把 Hibernate 生成的 SQL 打印到控制台，方便观察每步操作真正执行了什么。
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 让 data.sql 在 Hibernate 建完表之后再执行。
# 不加这一行，脚本会先于建表运行，INSERT 会直接报"表不存在"。
spring.jpa.defer-datasource-initialization=true
# 明确按 UTF-8 读取 data.sql，免得里面的中文被按系统默认编码解析成乱码。
spring.sql.init.encoding=UTF-8
