<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Blogsystem backend</title>
</head>
<body>
<h1>Blogsystem backend</h1>
<p>博客系统后端（入门版）</p>

<h2>文章接口</h2>
<ul>
    <li><a href="/api/articles">GET /api/articles</a>：查询全部文章</li>
    <li>POST /api/articles：新增文章，请求体为 {"title":"标题","content":"正文"}</li>
    <li>DELETE /api/articles/{id}：删除文章，成功返回 204，id 不存在返回 404</li>
</ul>
<p>POST 用 Postman 发，Body 选 raw + JSON。</p>

<h2>数据库</h2>
<ul>
    <li><a href="/h2-console">/h2-console</a>：H2 控制台（JDBC URL：jdbc:h2:mem:blogdb，用户 sa，密码留空）</li>
</ul>
</body>
</html>
