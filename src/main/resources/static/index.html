<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Spring Boot 入门示例</title>
</head>
<body>
<h1>Spring Boot 入门示例</h1>
<p>欢迎来到我的第一个 Spring Boot Web 项目。</p>
<p>你可以访问下面的接口：</p>
<ul>
    <li><a href="/request">/request</a>：@RequestMapping 示例</li>
    <li><a href="/hi">/hi</a>：返回一段问候文本</li>
    <li><a href="/test">/test</a>：返回另一段测试文本</li>
    <li>POST /users：创建用户</li>
    <li>PUT /users/{id}：整体修改用户</li>
    <li>PATCH /users/{id}：部分修改用户</li>
    <li>DELETE /users/{id}：删除用户</li>
</ul>
</body>
</html>
