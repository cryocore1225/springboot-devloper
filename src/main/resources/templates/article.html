<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${article.title}">글 제목</title>
    <style>
        body {
            font-family: "Malgun Gothic", "Microsoft YaHei", sans-serif;
            max-width: 720px;
            margin: 40px auto;
            padding: 0 16px;
            line-height: 1.7;
            color: #222;
        }
        h1 { margin-bottom: 8px; }
        .id { color: #999; font-size: 13px; margin-bottom: 24px; }
        .content { white-space: pre-wrap; }
        a { color: #2f6feb; text-decoration: none; }
    </style>
</head>
<body>

<h1 th:text="${article.title}">글 제목</h1>
<p class="id" th:text="'#' + ${article.id}">#1</p>

<p class="content" th:text="${article.content}">본문</p>

<p><a th:href="@{/articles}">목록으로</a></p>

</body>
</html>
